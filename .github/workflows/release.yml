# Release — triggered by a v* tag push (e.g. v0.3.0).
#
# Jobs:
#   lint    — format check, clippy, cargo-deny (mirrors ci.yml's lint job)
#   test    — lib unit tests, then all integration tests, including the Docker
#             harness (mirrors ci.yml's test job)
#   release — only runs once lint and test both succeed (needs: [lint, test])
#
# release.yml does not depend on ci.yml's own run for the same push: a tag
# push and the branch push that usually accompanies it are independent
# trigger events, so ci.yml finishing (or even starting) is not guaranteed
# before this workflow's tag-triggered run reaches its release job. Re-running
# the checks here, gated with `needs:`, is what actually stops a release from
# being cut while lint or tests are broken — duplicated CI time per release,
# accepted deliberately for that guarantee.
#
# release job steps:
#   1. Build stripped release binary for x86_64-unknown-linux-gnu
#   2. cargo-about generates LICENSE-THIRD-PARTY from about.hbs
#   3. Package ghbrk-<tag>-x86_64-unknown-linux-gnu.tar.gz
#   4. Create GitHub Release and upload the tarball

name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  TARGET: x86_64-unknown-linux-gnu
  PLATFORM: x86_64-linux

jobs:
  # ---------------------------------------------------------------------------
  # lint — identical gate to ci.yml's lint job
  # ---------------------------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable (rustfmt + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build artefacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy (all targets, all features)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2

  # ---------------------------------------------------------------------------
  # test — identical gate to ci.yml's test job (harness included)
  # ---------------------------------------------------------------------------
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable (with musl target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Cache Rust build artefacts
        uses: Swatinem/rust-cache@v2

      - name: Install musl-tools
        run: sudo apt-get install -y --no-install-recommends musl-tools

      - name: Create ghbrk-clients group and add runner
        run: |
          sudo groupadd --system ghbrk-clients
          sudo usermod -aG ghbrk-clients runner

      - name: Unit tests (lib)
        run: cargo test --lib

      - name: Integration tests (all suites, serial)
        run: sg ghbrk-clients -c 'cargo test --tests -- --test-threads=1'

  # ---------------------------------------------------------------------------
  # release — only runs once lint and test both succeed
  # ---------------------------------------------------------------------------
  release:
    name: Build and release
    runs-on: ubuntu-latest
    needs: [lint, test]

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # Explicit target documents intent; on ubuntu-latest the host IS
          # x86_64-linux so this is a no-op in practice.
          targets: x86_64-unknown-linux-gnu

      # cache-on-failure=true ensures a failed install step does not evict a
      # previously warm cache (including a cached cargo-about binary).
      - name: Cache Rust build artefacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Build release binary
        run: cargo build --release --target $TARGET

      # strip removes debug symbols, cutting binary size ~60-70 %.
      - name: Strip binary
        run: strip target/$TARGET/release/ghbrk

      # cargo-about walks the dependency graph and renders about.hbs into a
      # plain-text license file. --locked pins to the exact Cargo.lock tree.
      # On a cache hit, cargo detects the binary already exists and skips
      # re-compilation (~3 min saved).
      - name: Install cargo-about
        run: cargo install cargo-about --locked --features=cli

      - name: Generate LICENSE-THIRD-PARTY
        run: cargo about generate --config about.toml about.hbs --output-file LICENSE-THIRD-PARTY

      # Archive layout:
      #   ghbrk-v0.3.0-x86_64-linux/
      #     ghbrk
      #     LICENSE
      #     LICENSE-THIRD-PARTY
      - name: Package tarball
        run: |
          TAG="${GITHUB_REF_NAME}"
          DIRNAME="ghbrk-${TAG}-${PLATFORM}"
          ARCHIVE="${DIRNAME}.tar.gz"
          mkdir -p "${DIRNAME}"
          cp "target/${TARGET}/release/ghbrk" "${DIRNAME}/ghbrk"
          cp LICENSE "${DIRNAME}/LICENSE"
          cp LICENSE-THIRD-PARTY "${DIRNAME}/LICENSE-THIRD-PARTY"
          tar czf "${ARCHIVE}" "${DIRNAME}/"
          echo "ARCHIVE=${ARCHIVE}" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: ${{ env.ARCHIVE }}
